# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

# De-CV: a compact work index, not a job-application dossier.
# Every item points to a real path or a real homepage anchor.
main:
  - name: Agenda
    url: /
    weight: 10
  - name: Projects
    url: /projects/
    weight: 11
  - name: Papers
    url: /publications/
    weight: 12
  - name: News
    url: /#news
    weight: 13
  - name: Experience
    url: /experience/
    weight: 20
