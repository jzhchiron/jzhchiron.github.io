{{ define "main" }}
  <h1 class="text-3xl font-semibold tracking-tight">{{ .Title }}</h1>
  {{ with .Content }}<div class="prose content-prose mt-6">{{ . }}</div>{{ end }}
  {{ if .Pages }}
    <ul class="mt-8 space-y-3">
      {{ range .Pages }}
        <li><a class="text-accent underline decoration-hairline underline-offset-4 hover:decoration-current" href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{ end }}
    </ul>
  {{ end }}
{{ end }}
